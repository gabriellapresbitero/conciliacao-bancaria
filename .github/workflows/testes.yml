name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e rodar os testes
        run: mvn -B verify
      - name: Rodar o exemplo
        run: |
          java -jar target/conciliacao.jar --extrato exemplos/extrato_marco.ofx --sistema exemplos/sistema_marco.csv || [ $? -eq 2 ]
